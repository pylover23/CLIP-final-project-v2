<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#07111F"/>
  <text x="80" y="96" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">05 / Prompt 设计</text>
  <text x="80" y="146" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700">从粗粒度到细粒度的五类 Prompt</text>
  <rect x="80" y="190" width="1120" height="200" rx="26" fill="#0B1727" stroke="#20344F" stroke-width="2"/>
  <rect x="106" y="228" width="190" height="122" rx="18" fill="#10243C"/>
  <rect x="320" y="228" width="190" height="122" rx="18" fill="#10243C"/>
  <rect x="534" y="228" width="190" height="122" rx="18" fill="#10243C"/>
  <rect x="748" y="228" width="190" height="122" rx="18" fill="#10243C"/>
  <rect x="962" y="228" width="212" height="122" rx="18" fill="#14304B" stroke="#26C6DA" stroke-width="2"/>
  <text x="128" y="268" fill="#26C6DA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">type</text>
  <text x="128" y="306" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">a photo of a</text>
  <text x="128" y="330" fill="#EAF2FF" font-family="Consolas, Courier New, monospace" font-size="16">{product_type}</text>
  <text x="342" y="268" fill="#26C6DA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">material</text>
  <text x="342" y="306" fill="#EAF2FF" font-family="Consolas, Courier New, monospace" font-size="16">{material}</text>
  <text x="342" y="330" fill="#EAF2FF" font-family="Consolas, Courier New, monospace" font-size="16">{product_type}</text>
  <text x="556" y="268" fill="#26C6DA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">brand</text>
  <text x="556" y="306" fill="#EAF2FF" font-family="Consolas, Courier New, monospace" font-size="16">{brand}</text>
  <text x="556" y="330" fill="#EAF2FF" font-family="Consolas, Courier New, monospace" font-size="16">{product_type}</text>
  <text x="770" y="268" fill="#26C6DA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">brand_material</text>
  <text x="770" y="306" fill="#EAF2FF" font-family="Consolas, Courier New, monospace" font-size="16">{brand} {material}</text>
  <text x="770" y="330" fill="#EAF2FF" font-family="Consolas, Courier New, monospace" font-size="16">{product_type}</text>
  <text x="988" y="268" fill="#66E3FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">full</text>
  <text x="988" y="306" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">a photo of a</text>
  <text x="988" y="330" fill="#EAF2FF" font-family="Consolas, Courier New, monospace" font-size="16">{product_title}</text>
  <rect x="80" y="426" width="530" height="220" rx="24" fill="#0E1B2D" stroke="#20344F" stroke-width="2"/>
  <text x="108" y="472" fill="#66E3FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">实验假设</text>
  <text x="108" y="526" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22">文本信息越完整，越有利于区分外观相近的商品。</text>
  <text x="108" y="572" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">尤其在同类别内部，品牌、材质和标题细节会影响检索排序。</text>
  <rect x="642" y="426" width="558" height="220" rx="24" fill="#0E1B2D" stroke="#20344F" stroke-width="2"/>
  <text x="670" y="472" fill="#66E3FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">设计取舍</text>
  <text x="670" y="522" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19">· 没有使用颜色字段</text>
  <text x="670" y="552" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">因为数据中存在 Unknown Color / Multi / Multicolor 等噪声值</text>
  <text x="670" y="596" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19">· `full` Prompt 最接近真实用户表达</text>
  <text x="670" y="626" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">因此它也是最值得重点观察的一组实验条件</text>
  <text x="1192" y="668" fill="#71839E" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="end">06</text>
</svg>
