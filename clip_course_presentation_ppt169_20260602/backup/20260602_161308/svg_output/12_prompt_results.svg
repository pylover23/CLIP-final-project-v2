<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#07111F"/>
  <text x="80" y="96" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">11 / 结果一</text>
  <text x="80" y="146" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700">完整商品标题远优于属性拼接 Prompt</text>
  <rect x="80" y="190" width="780" height="446" rx="24" fill="#0B1727" stroke="#20344F" stroke-width="2"/>
  <text x="108" y="236" fill="#66E3FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">Original CLIP 下不同 Prompt 的 Recall@5</text>
  <line x1="132" y1="572" x2="132" y2="290" stroke="#71839E" stroke-width="2"/>
  <line x1="132" y1="572" x2="786" y2="572" stroke="#71839E" stroke-width="2"/>
  <rect x="180" y="547" width="68" height="25" fill="#FF8A4C"/>
  <rect x="290" y="540" width="68" height="32" fill="#FF8A4C"/>
  <rect x="400" y="545" width="68" height="27" fill="#FF8A4C"/>
  <rect x="510" y="532" width="68" height="40" fill="#FF8A4C"/>
  <rect x="620" y="290" width="68" height="282" fill="#26C6DA"/>
  <text x="214" y="605" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="middle">type</text>
  <text x="324" y="605" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="middle">material</text>
  <text x="434" y="605" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="middle">brand</text>
  <text x="544" y="605" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="middle">brand_material</text>
  <text x="654" y="605" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="middle">full</text>
  <text x="214" y="536" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="middle">0.0482</text>
  <text x="324" y="529" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="middle">0.0688</text>
  <text x="434" y="534" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="middle">0.0527</text>
  <text x="544" y="521" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="middle">0.0786</text>
  <text x="654" y="278" fill="#26C6DA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="700">0.5446</text>
  <rect x="896" y="190" width="304" height="446" rx="24" fill="#0E1B2D" stroke="#20344F" stroke-width="2"/>
  <text x="924" y="236" fill="#66E3FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">关键发现</text>
  <text x="924" y="298" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">1. 仅靠类别或少量属性，效果很弱</text>
  <text x="924" y="346" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">2. `full` Prompt 明显跳升</text>
  <text x="924" y="376" fill="#26C6DA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="700">0.5446</text>
  <text x="924" y="422" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">说明完整标题能提供更丰富的商品名称、款式与用途信息</text>
  <text x="924" y="492" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">3. 这也解释了后续为什么要重点看 `full` 条件</text>
  <text x="924" y="548" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">Prompt 不是附属变量，而是性能决定因素之一。</text>
  <text x="1192" y="668" fill="#71839E" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="end">12</text>
</svg>
