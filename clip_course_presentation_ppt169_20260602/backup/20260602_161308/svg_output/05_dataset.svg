<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#07111F"/>
  <text x="80" y="96" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">04 / 数据集</text>
  <text x="80" y="146" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700">ABO 子集构建：14 类、5600 样本</text>
  <rect x="80" y="188" width="1120" height="112" rx="24" fill="#0E1B2D" stroke="#20344F" stroke-width="2"/>
  <rect x="104" y="214" width="222" height="60" rx="18" fill="#10243C"/>
  <rect x="352" y="214" width="222" height="60" rx="18" fill="#10243C"/>
  <rect x="600" y="214" width="222" height="60" rx="18" fill="#10243C"/>
  <rect x="848" y="214" width="328" height="60" rx="18" fill="#10243C"/>
  <text x="126" y="251" fill="#26C6DA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">14 类商品</text>
  <text x="374" y="251" fill="#26C6DA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">5600 条样本</text>
  <text x="622" y="251" fill="#26C6DA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">72 个品牌</text>
  <text x="870" y="251" fill="#26C6DA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">训练 / 测试 = 4480 / 1120</text>
  <rect x="80" y="334" width="500" height="312" rx="24" fill="#0B1727" stroke="#20344F" stroke-width="2"/>
  <text x="108" y="380" fill="#66E3FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">数据字段与选取原则</text>
  <text x="108" y="430" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">关键字段</text>
  <text x="108" y="464" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">ProductId / Brand / Category / ProductType</text>
  <text x="108" y="494" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">Material / ProductTitle / Image</text>
  <text x="108" y="546" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">构建方式</text>
  <text x="108" y="580" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">· 每类固定抽取 400 条样本</text>
  <text x="108" y="610" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">· 保障类间分布均衡，避免类别偏置</text>
  <rect x="620" y="334" width="580" height="312" rx="24" fill="#0B1727" stroke="#20344F" stroke-width="2"/>
  <text x="648" y="380" fill="#66E3FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">分层划分与实验价值</text>
  <rect x="648" y="416" width="520" height="72" rx="18" fill="#10243C"/>
  <text x="676" y="448" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">每个类别内部随机打乱，再按 8:2 划分训练与测试</text>
  <text x="676" y="474" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">保证每类都包含稳定的训练样本与测试样本</text>
  <rect x="648" y="510" width="520" height="104" rx="18" fill="#10243C"/>
  <text x="676" y="546" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">为什么这份数据适合本实验？</text>
  <text x="676" y="580" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">· 有品牌、材质、标题等多粒度文本信息</text>
  <text x="676" y="606" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">· 存在大量“同类但难区分”的真实商品样本</text>
  <text x="1192" y="668" fill="#71839E" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="end">05</text>
</svg>
