<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#07111F"/>
  <text x="80" y="96" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">03 / 任务定义</text>
  <text x="80" y="146" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700">任务定义：给定文本，返回最匹配商品图像</text>
  <rect x="80" y="192" width="1120" height="176" rx="24" fill="#0B1727" stroke="#20344F" stroke-width="2"/>
  <text x="110" y="236" fill="#26C6DA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">一句话描述任务</text>
  <text x="110" y="292" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28">输入一条商品描述 Prompt，在候选图像库中检索最相关的商品图片。</text>
  <text x="110" y="332" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">最终关注的是：正确图像能否出现在 Top-K 里，以及它排在多靠前的位置。</text>
  <rect x="80" y="404" width="248" height="214" rx="22" fill="#0E1B2D" stroke="#20344F" stroke-width="2"/>
  <rect x="368" y="404" width="248" height="214" rx="22" fill="#0E1B2D" stroke="#20344F" stroke-width="2"/>
  <rect x="656" y="404" width="248" height="214" rx="22" fill="#0E1B2D" stroke="#20344F" stroke-width="2"/>
  <rect x="944" y="404" width="256" height="214" rx="22" fill="#0E1B2D" stroke="#20344F" stroke-width="2"/>
  <use data-icon="chunk-filled/magnifying-glass" x="180" y="434" width="48" height="48" fill="#26C6DA"/>
  <use data-icon="chunk-filled/layers" x="468" y="434" width="48" height="48" fill="#26C6DA"/>
  <use data-icon="chunk-filled/database" x="756" y="434" width="48" height="48" fill="#26C6DA"/>
  <use data-icon="chunk-filled/chart-bar" x="1048" y="434" width="48" height="48" fill="#26C6DA"/>
  <text x="102" y="516" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">Prompt 输入</text>
  <text x="102" y="552" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">如：a photo of a metal</text>
  <text x="102" y="580" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">table lamp with glass shade</text>
  <text x="390" y="516" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">CLIP 编码</text>
  <text x="390" y="552" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">文本与图像映射到</text>
  <text x="390" y="580" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">同一语义向量空间</text>
  <text x="678" y="516" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">向量检索</text>
  <text x="678" y="552" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">ChromaDB 存储图像 embedding</text>
  <text x="678" y="580" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">返回最相近的候选结果</text>
  <text x="966" y="516" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">指标评估</text>
  <text x="966" y="552" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">Recall@K</text>
  <text x="966" y="580" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">MRR@K / NDCG@K</text>
  <path d="M328 511 H368" stroke="#26C6DA" stroke-width="4" stroke-linecap="round"/>
  <path d="M616 511 H656" stroke="#26C6DA" stroke-width="4" stroke-linecap="round"/>
  <path d="M904 511 H944" stroke="#26C6DA" stroke-width="4" stroke-linecap="round"/>
  <text x="1192" y="668" fill="#71839E" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="end">04</text>
</svg>
