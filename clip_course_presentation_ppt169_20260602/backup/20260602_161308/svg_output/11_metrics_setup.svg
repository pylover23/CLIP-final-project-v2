<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#07111F"/>
  <text x="80" y="96" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">10 / 实验设置</text>
  <text x="80" y="146" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700">实验设置：统一比较、统一指标</text>
  <rect x="80" y="190" width="432" height="446" rx="24" fill="#0B1727" stroke="#20344F" stroke-width="2"/>
  <text x="108" y="236" fill="#66E3FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">超参数与训练设定</text>
  <rect x="108" y="276" width="376" height="58" rx="16" fill="#10243C"/>
  <rect x="108" y="350" width="376" height="58" rx="16" fill="#10243C"/>
  <rect x="108" y="424" width="376" height="58" rx="16" fill="#10243C"/>
  <rect x="108" y="498" width="376" height="58" rx="16" fill="#10243C"/>
  <text x="132" y="313" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">embedding_dim = 512</text>
  <text x="132" y="387" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">learning rate = 0.001</text>
  <text x="132" y="461" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">temperature = 0.07</text>
  <text x="132" y="535" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">epoch = 20</text>
  <text x="108" y="602" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">Linear Probe 的最优参数由 grid search 得到，随后用于后续对比与消融。</text>
  <rect x="548" y="190" width="652" height="446" rx="24" fill="#0B1727" stroke="#20344F" stroke-width="2"/>
  <text x="576" y="236" fill="#66E3FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">评价指标：衡量“命中”和“排序”两件事</text>
  <rect x="576" y="276" width="596" height="88" rx="18" fill="#10243C"/>
  <text x="604" y="310" fill="#26C6DA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">Recall@K</text>
  <text x="604" y="340" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">正确图片是否出现在前 K 个结果里</text>
  <rect x="576" y="386" width="596" height="88" rx="18" fill="#10243C"/>
  <text x="604" y="420" fill="#26C6DA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">MRR@K</text>
  <text x="604" y="450" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">正确图片排得越靠前，分数越高</text>
  <rect x="576" y="496" width="596" height="88" rx="18" fill="#10243C"/>
  <text x="604" y="530" fill="#26C6DA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">NDCG@K</text>
  <text x="604" y="560" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">不仅关注是否命中，也关注命中的相对排序质量</text>
  <text x="576" y="614" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">因此后面看到 Recall 上升时，我们还会同步看 MRR / NDCG 是否一起改善，避免“只命中不靠前”的假提升。</text>
  <text x="1192" y="668" fill="#71839E" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="end">11</text>
</svg>
