<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#07111F"/>
  <text x="80" y="96" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">13 / 结果三</text>
  <text x="80" y="146" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700">进一步发现：文本侧更关键，但双侧协同最稳</text>
  <rect x="80" y="190" width="540" height="446" rx="24" fill="#0B1727" stroke="#20344F" stroke-width="2"/>
  <text x="108" y="236" fill="#66E3FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">Linear Probe 消融</text>
  <rect x="108" y="286" width="484" height="82" rx="18" fill="#10243C"/>
  <text x="134" y="318" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">属性型 Prompt：text only 通常优于 vision only</text>
  <text x="134" y="346" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">例如 brand_material 下，0.1402 ＞ 0.1143</text>
  <rect x="108" y="390" width="484" height="82" rx="18" fill="#10243C"/>
  <text x="134" y="422" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">完整标题 Prompt：text+vision 最好</text>
  <text x="134" y="450" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">Top-20 Recall 达到 0.9384，说明双侧协同更稳</text>
  <rect x="108" y="494" width="484" height="100" rx="18" fill="#14304B" stroke="#26C6DA" stroke-width="2"/>
  <text x="134" y="530" fill="#26C6DA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">解释</text>
  <text x="134" y="562" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">当查询本身来自文本时，先调文本侧更直接；</text>
  <text x="134" y="590" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">但当文本足够丰富时，重塑图文共同空间才最有效。</text>
  <rect x="656" y="190" width="544" height="446" rx="24" fill="#0B1727" stroke="#20344F" stroke-width="2"/>
  <text x="684" y="236" fill="#66E3FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">误差分析</text>
  <rect x="684" y="286" width="488" height="68" rx="18" fill="#10243C"/>
  <text x="712" y="326" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">Top-20 未命中样本：72 / 1120，错误率 6.43%</text>
  <rect x="684" y="378" width="232" height="96" rx="18" fill="#10243C"/>
  <rect x="940" y="378" width="232" height="96" rx="18" fill="#10243C"/>
  <rect x="684" y="496" width="232" height="96" rx="18" fill="#10243C"/>
  <rect x="940" y="496" width="232" height="96" rx="18" fill="#10243C"/>
  <text x="704" y="414" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">同类商品视觉过于相似</text>
  <text x="704" y="442" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15">是最主要错误来源</text>
  <text x="960" y="414" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">跨类别混淆</text>
  <text x="960" y="442" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15">常与品牌、标题语义重叠有关</text>
  <text x="704" y="532" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">非英文标题与翻译损耗</text>
  <text x="704" y="560" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15">会降低文本编码质量</text>
  <text x="960" y="532" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">低质量标题噪声</text>
  <text x="960" y="560" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15">如“24”或 Unknown Material 等占位文本</text>
  <text x="1192" y="668" fill="#71839E" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="end">14</text>
</svg>
