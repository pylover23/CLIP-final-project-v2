<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#07111F"/>
  <text x="80" y="96" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">09 / 系统实现</text>
  <text x="80" y="146" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700">关键实现：CLIP Embedding + ChromaDB Top-K 检索</text>
  <rect x="80" y="190" width="1120" height="446" rx="24" fill="#0B1727" stroke="#20344F" stroke-width="2"/>
  <rect x="116" y="302" width="214" height="198" rx="24" fill="#10243C"/>
  <rect x="380" y="302" width="214" height="198" rx="24" fill="#10243C"/>
  <rect x="644" y="302" width="214" height="198" rx="24" fill="#10243C"/>
  <rect x="908" y="302" width="256" height="198" rx="24" fill="#14304B" stroke="#26C6DA" stroke-width="2"/>
  <use data-icon="chunk-filled/database" x="194" y="232" width="58" height="58" fill="#26C6DA"/>
  <text x="152" y="354" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">离线建库</text>
  <text x="136" y="396" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">测试集图像先经过</text>
  <text x="136" y="422" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">CLIP 编码，写入 ChromaDB</text>
  <use data-icon="chunk-filled/magnifying-glass" x="458" y="232" width="58" height="58" fill="#26C6DA"/>
  <text x="416" y="354" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">在线查询</text>
  <text x="400" y="396" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">把不同 Prompt 编码成</text>
  <text x="400" y="422" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">文本向量作为检索查询</text>
  <use data-icon="chunk-filled/layers" x="722" y="232" width="58" height="58" fill="#26C6DA"/>
  <text x="682" y="354" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">相似度召回</text>
  <text x="664" y="396" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">返回最接近的图像</text>
  <text x="664" y="422" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">候选集 Top-K</text>
  <use data-icon="chunk-filled/chart-bar" x="1008" y="232" width="58" height="58" fill="#26C6DA"/>
  <text x="968" y="354" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">统一评估</text>
  <text x="950" y="396" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">对比不同模型、不同 Prompt</text>
  <text x="950" y="422" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">在 Recall / MRR / NDCG 上的差异</text>
  <path d="M330 401 H380" stroke="#26C6DA" stroke-width="4" stroke-linecap="round"/>
  <path d="M594 401 H644" stroke="#26C6DA" stroke-width="4" stroke-linecap="round"/>
  <path d="M858 401 H908" stroke="#26C6DA" stroke-width="4" stroke-linecap="round"/>
  <text x="116" y="560" fill="#66E3FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">它的意义不只是“跑通检索流程”</text>
  <text x="116" y="596" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">而是把 Prompt 设计、模型微调和向量检索评测串成了一条完整实验链路。</text>
  <text x="1192" y="668" fill="#71839E" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="end">10</text>
</svg>
