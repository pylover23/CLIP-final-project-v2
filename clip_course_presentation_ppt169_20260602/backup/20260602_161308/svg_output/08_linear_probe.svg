<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#07111F"/>
  <text x="80" y="96" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">07 / 微调方法一</text>
  <text x="80" y="146" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700">Linear Probe：冻结主干，只训练投影层</text>
  <rect x="80" y="190" width="548" height="446" rx="24" fill="#0B1727" stroke="#20344F" stroke-width="2"/>
  <text x="108" y="236" fill="#66E3FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">核心思想</text>
  <text x="108" y="292" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21">保留 CLIP 已学到的通用图文语义，只在输出端增加可训练线性层。</text>
  <text x="108" y="350" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">图像侧：zᵥ = Wᵥv + bᵥ</text>
  <text x="108" y="382" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">文本侧：zₜ = Wₜt + bₜ</text>
  <text x="108" y="444" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">优点</text>
  <text x="108" y="478" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">· 参数少、训练快</text>
  <text x="108" y="506" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">· 易于解释“适配发生在哪一层”</text>
  <text x="108" y="534" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">· 适合做 baseline 级别的轻量改造</text>
  <rect x="108" y="566" width="492" height="44" rx="14" fill="#10243C"/>
  <text x="132" y="594" fill="#26C6DA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">我们还进一步做了 text only / vision only / text+vision 消融实验</text>
  <rect x="662" y="190" width="538" height="446" rx="24" fill="#0E1B2D" stroke="#20344F" stroke-width="2"/>
  <rect x="716" y="268" width="116" height="104" rx="18" fill="#10243C" stroke="#1E66F5" stroke-width="2"/>
  <rect x="1030" y="268" width="116" height="104" rx="18" fill="#10243C" stroke="#26C6DA" stroke-width="2"/>
  <rect x="874" y="248" width="114" height="144" rx="18" fill="#14304B" stroke="#26C6DA" stroke-width="2"/>
  <text x="738" y="326" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">图像</text>
  <text x="1050" y="326" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">文本</text>
  <text x="892" y="286" fill="#66E3FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700">可训练投影层</text>
  <text x="892" y="320" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">只改输出</text>
  <text x="892" y="346" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">不改主干</text>
  <path d="M832 320 H874" stroke="#1E66F5" stroke-width="4"/>
  <path d="M988 320 H1030" stroke="#26C6DA" stroke-width="4"/>
  <text x="716" y="476" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">商品域适配被限制在“向量空间重映射”这一层，</text>
  <text x="716" y="508" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">因此是一次成本较低、结构清晰的轻量微调尝试。</text>
  <text x="1192" y="668" fill="#71839E" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="end">08</text>
</svg>
