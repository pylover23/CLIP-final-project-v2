<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#07111F"/>
  <rect x="0" y="0" width="1280" height="720" fill="#26C6DA" fill-opacity="0.04"/>
  <rect x="64" y="58" width="1152" height="604" rx="28" fill="#0B1727" stroke="#20344F" stroke-width="2"/>
  <text x="84" y="108" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">01 / 问题背景</text>
  <text x="84" y="154" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700">电商检索场景中的真实问题</text>
  <rect x="84" y="196" width="350" height="402" rx="24" fill="#0E1B2D" stroke="#20344F" stroke-width="2"/>
  <text x="110" y="242" fill="#26C6DA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">为什么值得做</text>
  <rect x="110" y="272" width="298" height="86" rx="18" fill="#10243C"/>
  <use data-icon="chunk-filled/users" x="132" y="294" width="28" height="28" fill="#26C6DA"/>
  <text x="176" y="312" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">用户通常输入自然语言描述</text>
  <text x="176" y="338" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15">而不是仅靠品牌名或单关键词检索</text>
  <rect x="110" y="374" width="298" height="86" rx="18" fill="#10243C"/>
  <use data-icon="chunk-filled/magnifying-glass" x="132" y="396" width="28" height="28" fill="#26C6DA"/>
  <text x="176" y="414" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">同类商品外观高度相近</text>
  <text x="176" y="440" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15">细粒度差异很容易在排序里被淹没</text>
  <rect x="110" y="476" width="298" height="86" rx="18" fill="#10243C"/>
  <use data-icon="chunk-filled/lightbulb" x="132" y="498" width="28" height="28" fill="#26C6DA"/>
  <text x="176" y="516" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">多模态模型带来新可能</text>
  <text x="176" y="542" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15">能直接学习图像与文本之间的语义对齐</text>
  <rect x="470" y="196" width="714" height="402" rx="24" fill="#091423" stroke="#20344F" stroke-width="2"/>
  <text x="498" y="242" fill="#66E3FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">课堂展示里的叙事角度</text>
  <text x="498" y="304" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700">这不是“做了一个模型”，而是回答一个检索问题：</text>
  <text x="498" y="366" fill="#26C6DA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="40" font-weight="700">商品描述写得更细，模型会不会更懂你？</text>
  <text x="498" y="432" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24">如果原始 CLIP 不够，再做轻量微调，能把效果推高多少？</text>
  <path d="M498 472 H1142" stroke="#20344F" stroke-width="2"/>
  <text x="498" y="520" fill="#A8B7CF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">因此，这个项目同时考察三件事：</text>
  <text x="520" y="560" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19">1. 原始多模态模型的商品域表现</text>
  <text x="520" y="592" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19">2. 轻量微调方法是否有效</text>
  <text x="520" y="624" fill="#EAF2FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19">3. Prompt 细粒度与检索性能之间是否存在稳定关联</text>
  <text x="1150" y="650" fill="#71839E" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="end">02</text>
</svg>
