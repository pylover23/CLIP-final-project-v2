<text x="508" y="466" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" >看参数效率与效果差异。</text>
<text x="900" y="282" fill="#127A94" font-family="Arial, Microsoft YaHei, sans-serif" font-size="56" font-weight="700" text-anchor="start" >Q3</text>
