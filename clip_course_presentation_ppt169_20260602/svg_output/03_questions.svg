<text x="116" y="282" fill="#127A94" font-family="Arial, Microsoft YaHei, sans-serif" font-size="56" font-weight="700" text-anchor="start" >Q1</text>
<text x="116" y="336" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start" >原始 CLIP 在 ABO 商品</text>
<text x="116" y="374" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start" >检索任务里到底够不够用？</text>
<text x="116" y="434" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" >先测 zero-shot 基线，</text>
<text x="116" y="466" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" >判断预训练模型的原始上限。</text>
<text x="508" y="282" fill="#127A94" font-family="Arial, Microsoft YaHei, sans-serif" font-size="56" font-weight="700" text-anchor="start" >Q2</text>
