<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#FBFBF8" stroke="none" stroke-width="0" rx="0" />
<rect x="56" y="50" width="1168" height="620" fill="#FBFBF8" stroke="#D8DEE6" stroke-width="2" rx="0" />
<line x1="86" y1="104" x2="1192" y2="104" stroke="#111111" stroke-width="2"/>
<text x="86" y="84" fill="#127A94" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="400" text-anchor="start" letter-spacing="2.4">BACKGROUND</text>
<text x="86" y="148" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="36" font-weight="700" text-anchor="start" >为什么做这个选题</text>
<text x="1200" y="84" fill="#6C7988" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" text-anchor="end" letter-spacing="2">02</text>
<text x="1200" y="652" fill="#6C7988" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" text-anchor="end" >2</text>
<text x="90" y="222" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" text-anchor="start" >电商检索的难点不是“找不到商品”，而是难以准确区分高度相似的商品。</text>
<text x="90" y="264" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" >本实验关注 text-to-image 检索：给定商品描述，返回最匹配的商品图像。</text>
<rect x="90" y="318" width="334" height="258" fill="#FFFFFF" stroke="#111111" stroke-width="2" rx="0" />
<rect x="460" y="318" width="334" height="258" fill="#FFFFFF" stroke="#111111" stroke-width="2" rx="0" />
<rect x="830" y="318" width="334" height="258" fill="#FFFFFF" stroke="#111111" stroke-width="2" rx="0" />
<text x="116" y="366" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start" >01  语义表达更自然</text>
<text x="116" y="406" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" >用户更习惯输入</text>
<text x="116" y="438" fill="#127A94" font-family="Arial, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" >“黑色皮质高跟鞋”</text>
<text x="116" y="472" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" >而不是只输入单个关键词。</text>
<text x="486" y="366" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start" >02  视觉相似度很高</text>
<text x="486" y="406" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" >同类商品外观接近，</text>
<text x="486" y="438" fill="#127A94" font-family="Arial, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" >品牌 / 材质 / 标题</text>
<text x="486" y="472" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" >共同决定检索区分能力。</text>
<text x="856" y="366" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start" >03  预训练模型可迁移</text>
<text x="856" y="406" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" >CLIP 提供跨模态对齐基础，</text>
<text x="856" y="438" fill="#127A94" font-family="Arial, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" >但是否足够适应商品域</text>
<text x="856" y="472" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" >需要实验验证。</text>
<rect x="90" y="600" width="1074" height="34" fill="#E6F7FB" stroke="none" stroke-width="0" rx="0" />
<text x="106" y="623" fill="#127A94" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" >目标：比较原始 CLIP、Linear Probe 与 LoRA，并分析 Prompt 细粒度对 Top-K 检索表现的影响。</text>
</svg>
