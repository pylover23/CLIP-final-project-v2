<text x="116" y="258" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start" >核心思想</text>
<text x="116" y="302" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" >冻结原始 CLIP 编码器，</text>
<text x="116" y="336" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" >只在图像侧和文本侧输出后</text>
<text x="116" y="370" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" >接入可训练线性投影层。</text>
<text x="116" y="432" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start" >优点</text>
<text x="116" y="472" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" >• 参数量小，训练快</text>
<text x="116" y="506" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" >• 保留 CLIP 原有通用视觉语义</text>
<text x="116" y="540" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" >• 适合验证“轻量适配”是否有效</text>
