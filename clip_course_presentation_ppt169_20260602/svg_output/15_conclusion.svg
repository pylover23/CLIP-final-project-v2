<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#0B1220" stroke="none" stroke-width="0" rx="0" />
<rect x="72" y="72" width="1136" height="576" fill="#111C2E" stroke="#1A2B44" stroke-width="2" rx="0" />
<text x="640" y="140" fill="#9DB6D3" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" text-anchor="middle" letter-spacing="2.6">结论与展望</text>
<text x="640" y="214" fill="#F6FAFF" font-family="Arial, Microsoft YaHei, sans-serif" font-size="44" font-weight="700" text-anchor="middle" >回到最初的三个问题</text>
<rect x="120" y="268" width="1040" height="76" fill="#11253F" stroke="none" stroke-width="0" rx="0" />
<text x="640" y="316" fill="#FFFFFF" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="middle" >答案是：原始 CLIP 能用，但 Prompt 与轻量微调共同决定了性能上限。</text>
<rect x="120" y="392" width="292" height="172" fill="none" stroke="#2E4768" stroke-width="2" rx="0" />
<rect x="494" y="392" width="292" height="172" fill="none" stroke="#2E4768" stroke-width="2" rx="0" />
<rect x="868" y="392" width="292" height="172" fill="none" stroke="#2E4768" stroke-width="2" rx="0" />
<text x="146" y="438" fill="#A6F1FD" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start" >Q1  原始 CLIP 够吗？</text>
<text x="146" y="486" fill="#EAF2FF" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" >能工作，但商品域细粒度</text>
<text x="146" y="516" fill="#EAF2FF" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" >区分能力仍有提升空间。</text>
<text x="520" y="438" fill="#A6F1FD" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start" >Q2  微调有效吗？</text>
<text x="520" y="486" fill="#EAF2FF" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" >有效，而且提升明显。</text>
<text x="520" y="520" fill="#FFFFFF" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start" >LoRA Recall@5 = 0.8339</text>
<text x="894" y="438" fill="#A6F1FD" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start" >Q3  Prompt 重要吗？</text>
<text x="894" y="486" fill="#EAF2FF" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" >非常重要。完整标题 Prompt</text>
<text x="894" y="516" fill="#EAF2FF" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" >远优于属性拼接。</text>
<text x="120" y="618" fill="#99B0C8" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" >后续工作：更大规模商品库、多模态推荐场景、线上检索系统验证。</text>
<text x="1160" y="618" fill="#FFFFFF" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="end" >谢谢</text>
</svg>
