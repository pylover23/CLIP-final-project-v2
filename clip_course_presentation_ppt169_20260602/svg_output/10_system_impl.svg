<text x="388" y="356" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" >以 ProductId_img 写入 ChromaDB</text>
<rect x="642" y="262" width="220" height="170" fill="#FFFFFF" stroke="#111111" stroke-width="2" rx="0" />
<text x="664" y="314" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start" >在线查询</text>
