<rect x="166" y="504" width="950" height="106" fill="#E6F7FB" stroke="#127A94" stroke-width="2" rx="0" />
<text x="190" y="548" fill="#127A94" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="start" >实现重点：统一使用 CLIP embedding 作为检索空间，保证不同模型和不同 Prompt 的结果可直接比较。</text>
<text x="190" y="584" fill="#127A94" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" >这样做也更贴近实际工业场景中的向量检索流水线。</text>
