<text x="86" y="148" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="36" font-weight="700" text-anchor="start" >关键实现：CLIP Embedding + ChromaDB Top-K 检索</text>
<text x="1200" y="84" fill="#6C7988" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" text-anchor="end" letter-spacing="2">10</text>
<text x="1200" y="652" fill="#6C7988" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" text-anchor="end" >10</text>
<rect x="90" y="262" width="220" height="170" fill="#FFFFFF" stroke="#111111" stroke-width="2" rx="0" />
<text x="112" y="314" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start" >离线编码</text>
<text x="112" y="356" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" >测试图像编码为 embedding</text>
<rect x="366" y="262" width="220" height="170" fill="#FFFFFF" stroke="#111111" stroke-width="2" rx="0" />
