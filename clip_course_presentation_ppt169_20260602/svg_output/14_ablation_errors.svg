<text x="116" y="252" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start" >A. 投影位置消融</text>
<text x="116" y="296" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" >属性型 Prompt 中，text only 通常优于 vision only。</text>
<text x="116" y="330" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" >说明文本侧适配对 text-to-image 更直接。</text>
<text x="696" y="252" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start" >B. full Prompt 下的最优配置</text>
<text x="696" y="296" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" >text+vision 在 Top-20 Recall 达到 0.9384。</text>
<text x="696" y="330" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" >信息足够丰富时，双侧协同最稳定。</text>
<text x="116" y="474" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start" >C. 典型错误来源</text>
<text x="116" y="518" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" >• 同类商品外观极其接近</text>
<text x="116" y="550" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" >• 跨类别边界模糊</text>
<text x="116" y="582" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" >• 标题描述质量不足</text>
<text x="696" y="474" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start" >D. 错误率较高类别</text>
