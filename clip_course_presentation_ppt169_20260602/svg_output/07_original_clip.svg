<text x="116" y="258" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start" >方法定位</text>
<text x="116" y="302" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" >• 直接使用预训练 CLIP ViT-B/32</text>
<text x="116" y="336" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" >• 不更新任何参数，作为 zero-shot baseline</text>
<text x="116" y="370" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" >• 先观察商品域上的原始跨模态对齐能力</text>
<text x="116" y="432" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start" >问题意识</text>
<text x="116" y="476" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" >预训练语义很强，但商品图像的</text>
<text x="116" y="508" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" >品牌、材质、款式差异更细，</text>
<text x="116" y="540" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" >可能需要任务域适配。</text>
