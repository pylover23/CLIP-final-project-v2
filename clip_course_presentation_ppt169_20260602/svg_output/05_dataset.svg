<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#FBFBF8" stroke="none" stroke-width="0" rx="0" />
<rect x="56" y="50" width="1168" height="620" fill="#FBFBF8" stroke="#D8DEE6" stroke-width="2" rx="0" />
<line x1="86" y1="104" x2="1192" y2="104" stroke="#111111" stroke-width="2"/>
<text x="86" y="84" fill="#127A94" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="400" text-anchor="start" letter-spacing="2.4">DATASET</text>
<text x="86" y="148" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="36" font-weight="700" text-anchor="start" >ABO 子集构建：14 类、5600 样本</text>
<text x="1200" y="84" fill="#6C7988" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" text-anchor="end" letter-spacing="2">05</text>
<text x="1200" y="652" fill="#6C7988" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="400" text-anchor="end" >5</text>
<rect x="90" y="212" width="240" height="112" fill="#FFFFFF" stroke="#111111" stroke-width="2" rx="0" />
<rect x="350" y="212" width="240" height="112" fill="#FFFFFF" stroke="#111111" stroke-width="2" rx="0" />
<rect x="610" y="212" width="240" height="112" fill="#FFFFFF" stroke="#111111" stroke-width="2" rx="0" />
<rect x="870" y="212" width="320" height="112" fill="#111111" stroke="#111111" stroke-width="2" rx="0" />
<text x="112" y="248" fill="#6C7988" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" >样本总数</text>
<text x="112" y="298" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="52" font-weight="700" text-anchor="start" >5600</text>
<text x="372" y="248" fill="#6C7988" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" >商品类别</text>
<text x="372" y="298" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="52" font-weight="700" text-anchor="start" >14</text>
<text x="632" y="248" fill="#6C7988" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" >训练 / 测试</text>
<text x="632" y="298" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="40" font-weight="700" text-anchor="start" >4480 / 1120</text>
<text x="892" y="248" fill="#A6F1FD" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" >品牌数</text>
<text x="892" y="298" fill="#FFFFFF" font-family="Arial, Microsoft YaHei, sans-serif" font-size="52" font-weight="700" text-anchor="start" >72</text>
<rect x="90" y="364" width="520" height="232" fill="#FFFFFF" stroke="#111111" stroke-width="2" rx="0" />
<rect x="650" y="364" width="540" height="232" fill="#FFFFFF" stroke="#111111" stroke-width="2" rx="0" />
<text x="116" y="408" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start" >数据构建</text>
<text x="116" y="448" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" >• 从 ABO 中选择 14 个类别，每类 400 条样本</text>
<text x="116" y="482" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" >• ProductId / ItemId / ProductTitle / Image 唯一</text>
<text x="116" y="516" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" >• 保留品牌、材质、标题等字段供 Prompt 构造</text>
<text x="676" y="408" fill="#111111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start" >划分策略</text>
<text x="676" y="448" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" >• 按类别分层划分，保持分布均衡</text>
<text x="676" y="482" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" >• 每类 320 条训练样本 + 80 条测试样本</text>
<text x="676" y="516" fill="#3E4A59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" >• 固定随机种子，保证实验可复现</text>
<rect x="90" y="620" width="1100" height="24" fill="#E6F7FB" stroke="none" stroke-width="0" rx="0" />
<text x="106" y="638" fill="#127A94" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start" >为什么重要：类内高相似 + 跨类弱差异，正适合检验 CLIP 的商品域迁移能力。</text>
</svg>
