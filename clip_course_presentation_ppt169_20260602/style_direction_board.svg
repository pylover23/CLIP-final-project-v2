  <text x="112" y="740" fill="#0d141c" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">适合：</text>
  <text x="202" y="740" fill="#42505d" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22">老师评审、课程答辩、强调“清楚和专业”</text>
  <text x="872" y="740" fill="#17324d" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">适合：</text>
  <text x="962" y="740" fill="#55697c" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22">研究汇报、学术展示、希望画面更柔和</text>

  <text x="112" y="784" fill="#0d141c" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">关键词：</text>
  <text x="214" y="784" fill="#42505d" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22">强对比 / 黑白主导 / 青蓝点睛 / 更锋利</text>
  <text x="872" y="784" fill="#17324d" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">关键词：</text>
  <text x="974" y="784" fill="#55697c" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22">冷灰层次 / 蓝灰细节 / 更克制 / 更平滑</text>
