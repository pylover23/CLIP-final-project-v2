  <text x="870" y="240" fill="#345d86" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">B / 温和研究版</text>

  <rect x="110" y="278" width="620" height="2" fill="#11181f"/>
  <rect x="870" y="278" width="620" height="2" fill="#6d89a5"/>

