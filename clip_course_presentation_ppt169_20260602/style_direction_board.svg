  <text x="870" y="404" fill="#17324d" font-family="Arial, Microsoft YaHei, sans-serif" font-size="56" font-weight="700">实验结果</text>

  <text x="112" y="458" fill="#6b7783" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22">白底、高对比、黑线框、单一青蓝强调，像正式课程答辩。</text>
  <text x="872" y="454" fill="#6f7f90" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22">冷灰底、蓝灰层次、更柔和的边框和分区，像研究汇报。</text>

